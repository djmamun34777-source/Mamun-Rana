name: Build Mamun Walkie Talkie APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required by AGP 9.1 / Gradle 9.3)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK & Accept Licenses (API 36.1)
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            build-tools;36.0.0
            platforms;android-36.1

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env for Secrets Gradle Plugin
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OTP_FROM_EMAIL: ${{ secrets.OTP_FROM_EMAIL }}
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi
          if [ -n "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY=$RESEND_API_KEY" > .env
            echo "OTP_FROM_EMAIL=${OTP_FROM_EMAIL:-onboarding@resend.dev}" >> .env
          fi

      - name: Decode Release Keystore (if configured in GitHub Secrets)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Debug Keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build Signed Release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact (Downloadable in Actions Summary)
        uses: actions/upload-artifact@v4
        with:
          name: mamun-walkie-talkie-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mamun-walkie-talkie-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Publish GitHub Release with Direct APK Download Links (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
